<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101523">
  <title>GB Runner · Nintendo DS</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="ds-app">
    <header class="ds-header">
      <a class="ds-brand" href="/" target="_top" aria-label="GB Runner home">
        <span class="ds-mark">DS</span>
        <span><strong>GB Runner</strong><small>Nintendo DS player</small></span>
      </a>
      <div class="ds-actions">
        <label class="action-button" for="romInput">Choose game</label>
        <input id="romInput" type="file" accept=".nds,.dsi,.srl,application/octet-stream">
        <button id="pauseButton" type="button" disabled>Pause</button>
        <button id="audioButton" type="button" disabled>Enable sound</button>
        <button id="fullscreenButton" type="button">Fullscreen</button>
      </div>
    </header>

    <section class="ds-player" aria-label="Nintendo DS game">
      <div class="ds-screen-frame">
        <canvas id="screenCanvas" width="256" height="384" tabindex="0" aria-label="Nintendo DS dual screens"></canvas>
        <div class="screen-hint">Tap the lower screen for touch input</div>
      </div>
      <div class="ds-controls" id="touchControls" aria-label="Nintendo DS touch controls">
        <div class="shoulder-controls">
          <button data-bit="9" type="button">L</button><button data-bit="8" type="button">R</button>
        </div>
        <div class="control-row">
          <div class="dpad">
            <button data-bit="6" class="up" type="button" aria-label="Up">▲</button>
            <button data-bit="5" class="left" type="button" aria-label="Left">◀</button>
            <button data-bit="4" class="right" type="button" aria-label="Right">▶</button>
            <button data-bit="7" class="down" type="button" aria-label="Down">▼</button>
          </div>
          <div class="system-buttons">
            <button data-bit="2" type="button">Select</button><button data-bit="3" type="button">Start</button>
          </div>
          <div class="face-buttons">
            <button data-bit="10" type="button">X</button><button data-bit="0" type="button">A</button>
            <button data-bit="11" type="button">Y</button><button data-bit="1" type="button">B</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="ds-footer">
      <span id="gameStatus" role="status" aria-live="polite">Choose a Nintendo DS game to begin.</span>
      <span>Arrow keys · Z/X/A/S · Enter/Backspace · saves stay in this browser</span>
    </footer>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
